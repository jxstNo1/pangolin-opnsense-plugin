[start]
command:/usr/local/etc/rc.d/pangolin_site start
parameters:
type:script
message:starting Pangolin site connector

[stop]
command:/usr/local/etc/rc.d/pangolin_site stop
parameters:
type:script
message:stopping Pangolin site connector

[restart]
command:/usr/local/etc/rc.d/pangolin_site restart
parameters:
type:script
message:restarting Pangolin site connector

[status]
command:/usr/local/sbin/pangolin-agent status --mode site --json
parameters:
type:script_output
message:get Pangolin site connector status
errors:no

[test]
command:/usr/local/sbin/pangolin-agent test --config /usr/local/etc/pangolin/site.json
parameters:
type:script_output
message:test Pangolin site endpoint
errors:no

[logs]
command:/usr/bin/tail -n 200 /var/log/pangolin/site.log
parameters:
type:script_output
message:read Pangolin site connector log
errors:no
