[start]
command:/usr/local/etc/rc.d/pangolin_client start
parameters:
type:script
message:starting Pangolin machine client

[stop]
command:/usr/local/etc/rc.d/pangolin_client stop
parameters:
type:script
message:stopping Pangolin machine client

[restart]
command:/usr/local/etc/rc.d/pangolin_client restart
parameters:
type:script
message:restarting Pangolin machine client

[status]
command:/usr/local/sbin/pangolin-agent status --mode client --json
parameters:
type:script_output
message:get Pangolin machine client status
errors:no

[test]
command:/usr/local/sbin/pangolin-agent test --config /usr/local/etc/pangolin/client.json
parameters:
type:script_output
message:test Pangolin machine client endpoint
errors:no

[logs]
command:/usr/bin/tail -n 200 /var/log/pangolin/client.log
parameters:
type:script_output
message:read Pangolin machine client log
errors:no
