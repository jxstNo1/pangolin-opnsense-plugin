[sync]
command:/usr/local/sbin/pluginctl -c pangolin_sync
parameters:
type:script_output
message:synchronise Pangolin agent configuration, DNS and firewall state

[dns-sync]
command:/usr/local/sbin/pluginctl -c pangolin_dns_sync
parameters:
type:script_output
message:synchronise Pangolin aliases into Unbound

[firewall-sync]
command:/usr/local/sbin/pluginctl -c pangolin_firewall_sync
parameters:
type:script_output
message:synchronise os-pangolin pf anchors

[cleanup]
command:/usr/local/sbin/pluginctl -c pangolin_uninstall
parameters:
type:script_output
message:remove Pangolin runtime state before package removal
errors:no

[dig]
command:/usr/local/bin/drill
parameters:%s
type:script_output
message:resolve a name through the local Unbound instance
errors:no
